packages:
  - "."

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0

overrides:
  axios: ^1.20.0
  follow-redirects: ^1.16.0
  form-data: ^4.0.6
  ws@^7.0.0: ^7.5.11
  ws@^8.0.0: ^8.21.0
  uuid@<11.1.1: ^11.1.1
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  nanoid@^3.0.0: ^3.3.18
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

auditConfig:
  ignoreGhsas:
    # zod (via botbuilder): fixed only in zod 4, but botbuilder 4.23.3 calls APIs removed in zod 4
    # (.nonstrict(), single-argument z.record()), so it cannot be overridden.
    # Remove once botbuilder supports zod >= 4.6.6.
    - GHSA-mrhx-c7xc-m3w5
    # @azure/msal-node (via botbuilder > @azure/identity): affects only the auth_code flow
    # (acquireTokenByCode), which the bot does not use. Fixed only in 7.1.0, two majors above what
    # @azure/identity accepts (^6.0.0), so it is not overridden.
    # Remove once @azure/identity accepts @azure/msal-node >= 7.1.0.
    - GHSA-xcx6-jx8p-x3h5
