name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Format / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から決まる
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # cache: pnpm は pnpm がインストール済みである必要があるため、pnpm のセットアップ後に実行する
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm exec vp fmt --check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat infra/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      # envs/{stg,prod}/terraform.tfvars は ../terraform.tfvars へのシンボリックリンク（実体は .gitignore 済み）。
      # リンク切れのままだと fmt がエラーになるため、CI では example から実体を作成する
      - name: Create terraform.tfvars from example
        run: cp infra/envs/terraform.tfvars.example infra/envs/terraform.tfvars

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Terraform validate (stg)
        working-directory: infra/envs/stg
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform validate (prod)
        working-directory: infra/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
