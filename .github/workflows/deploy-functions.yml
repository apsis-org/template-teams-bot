name: Deploy to Azure Functions

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先の環境"
        required: true
        default: "stg"
        type: choice
        options:
          - stg
          - prod
      deploy_teams_app:
        description: "Teams アプリも更新する（manifest.json を変更した場合）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp host.json deploy/
          cp package.json deploy/
          cd deploy && npm install --omit=dev
          zip -r ../deploy.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 1

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: deploy-package

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} \
            --src deploy.zip \
            --build-remote false

      # .env.example に列挙されたキーに対応する GitHub Environment Secret を
      # Function App の App Settings に反映する（make setup-secrets で登録した値）。
      # Terraform 側は app_settings を ignore_changes にしているため、ここが実行時設定の反映経路になる。
      # Secrets は実行時にしか列挙できないため toJSON(secrets) を使い、.env.example のキーだけを取り出す。
      - name: Apply runtime settings
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          keys="$(grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' .env.example | tr -d '=' || true)"
          settings=()
          for key in $keys; do
            value="$(jq -r --arg k "$key" '.[$k] // empty' <<< "$SECRETS_JSON")"
            if [[ -n "$value" ]]; then
              settings+=("${key}=${value}")
              echo "  ✓ ${key}"
            else
              echo "  - ${key}（Secret 未登録のためスキップ）"
            fi
          done
          if (( ${#settings[@]} == 0 )); then
            echo "反映するランタイム設定はありません"
            exit 0
          fi
          az functionapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} \
            --settings "${settings[@]}" \
            --output none

  build-teams-app:
    name: Build Teams App Package
    needs: deploy
    if: inputs.deploy_teams_app == true
    uses: ./.github/workflows/build-teams-app.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
