name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest-tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $TAG"

      - name: Determine next version
        id: next-version
        run: |
          LATEST="${{ steps.latest-tag.outputs.tag }}"
          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)

          # Collect commit messages since last tag
          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            COMMITS=$(git log "$LATEST"..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump type from conventional commits
          BUMP="none"
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE "^(BREAKING|major)"; then
              BUMP="major"
              break
            elif echo "$msg" | grep -qiE "^feat"; then
              [ "$BUMP" != "major" ] && BUMP="minor"
            elif echo "$msg" | grep -qiE "^fix|^perf|^chore|^build|^ci|^refactor"; then
              [ "$BUMP" = "none" ] && BUMP="patch"
            fi
          done <<< "$COMMITS"

          if [ "$BUMP" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT ($BUMP)"

      - name: Generate release notes
        if: steps.next-version.outputs.skip != 'true'
        id: release-notes
        run: |
          LATEST="${{ steps.latest-tag.outputs.tag }}"

          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            RANGE="$LATEST..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "notes<<RELEASE_NOTES_EOF"

            # Categorize commits
            BREAKING=$(git log "$RANGE" --pretty=format:"%s" | grep -iE "^(BREAKING|major)" || true)
            FEATS=$(git log "$RANGE" --pretty=format:"%s" | grep -iE "^feat" || true)
            FIXES=$(git log "$RANGE" --pretty=format:"%s" | grep -iE "^fix" || true)
            OTHERS=$(git log "$RANGE" --pretty=format:"%s" | grep -iEv "^(BREAKING|major|feat|fix|docs|style|test)" | grep -iE "^(perf|chore|build|ci|refactor)" || true)
            DOCS=$(git log "$RANGE" --pretty=format:"%s" | grep -iE "^docs" || true)

            if [ -n "$BREAKING" ]; then
              echo "## ⚠️ Breaking Changes"
              echo "$BREAKING" | sed 's/^/- /'
              echo ""
            fi

            if [ -n "$FEATS" ]; then
              echo "## ✨ Features"
              echo "$FEATS" | sed 's/^/- /'
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "## 🐛 Bug Fixes"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi

            if [ -n "$OTHERS" ]; then
              echo "## 🔧 Maintenance"
              echo "$OTHERS" | sed 's/^/- /'
              echo ""
            fi

            if [ -n "$DOCS" ]; then
              echo "## 📝 Documentation"
              echo "$DOCS" | sed 's/^/- /'
              echo ""
            fi

            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.next-version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.next-version.outputs.version }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "${{ steps.release-notes.outputs.notes }}" \
            --target "${{ github.sha }}"
