name: Release

# On every push to main, release-please creates or updates a release PR.
# Merging the release PR creates the tag and GitHub Release and updates CHANGELOG.md and package.json version.
# The version is derived from Conventional Commits (feat → minor, fix → patch, feat! / BREAKING CHANGE → major).
# Below 1.0.0, bump-minor-pre-major caps breaking changes at a minor bump.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    # Do not run in repositories created from the template (this is for versioning the template itself)
    if: github.repository == 'apsis-org/template-teams-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
