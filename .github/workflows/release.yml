name: Release

# main への push ごとに release-please がリリース PR を作成・更新する。
# リリース PR をマージすると、タグ・GitHub Release・CHANGELOG.md・package.json の version が更新される。
# バージョンは Conventional Commits から決まる（feat → minor、fix → patch、feat! / BREAKING CHANGE → major）。
# 1.0.0 未満の間は bump-minor-pre-major により破壊的変更でも minor までしか上がらない。

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    # テンプレートから作成したリポジトリでは実行しない（テンプレート本体のバージョン管理専用）
    if: github.repository == 'apsis-org/template-teams-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
