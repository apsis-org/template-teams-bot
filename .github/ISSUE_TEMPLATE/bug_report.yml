name: Bug report
description: Report a problem with the template
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a repository from the template
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Template version
      description: "The release you started from (e.g. v1.0.0) or the commit SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of Node.js / pnpm / Terraform / Azure Functions Core Tools, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      description: Make sure to redact credentials, tenant IDs, and other sensitive information.
      render: shell
