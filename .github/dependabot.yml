version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Keep the major version of @types/node aligned with the Azure Functions Node.js runtime
      # (runtime_version in infra/modules/function_app). Update it manually when bumping the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
